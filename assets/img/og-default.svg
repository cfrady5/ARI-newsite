<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="ARI — Applied Research Institute">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1B2C"/>
      <stop offset="0.6" stop-color="#1F3655"/>
      <stop offset="1" stop-color="#24426B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#3BAE48" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3BAE48" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <text x="90" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="34"
        font-weight="700" letter-spacing="6" fill="#3BAE48">APPLIED RESEARCH INSTITUTE</text>
  <text x="86" y="330" font-family="'Plus Jakarta Sans', sans-serif" font-size="92"
        font-weight="800" fill="#ffffff">Uniting innovators.</text>
  <text x="86" y="430" font-family="'Plus Jakarta Sans', sans-serif" font-size="92"
        font-weight="800" fill="#ffffff">Powering <tspan fill="#3BAE48">innovation.</tspan></text>
  <text x="90" y="540" font-family="'Plus Jakarta Sans', sans-serif" font-size="32"
        font-weight="500" fill="#9fb1c6">Because the warfighter can't wait.</text>
  <text x="1000" y="565" font-family="'Plus Jakarta Sans', sans-serif" font-size="64"
        font-weight="800" font-style="italic" fill="#3BAE48">ARI</text>
</svg>
